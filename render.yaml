services:
  - type: web
    name: flight-notification-system
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python core/ml/generate_data.py && python core/ml/train.py && python core/db.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120"
    autoDeploy: true
